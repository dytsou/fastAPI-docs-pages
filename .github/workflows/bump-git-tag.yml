name: Bump Patch Version

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Bump git tag patch version
        uses: dytsou/release/bump-git-tag@d592bd95014310075ab2f016fb90a6f854b56d26 # v1.4.0
        with:
          base-branch: main
          labels: ci, maintenance
          move-major-tag: "true"